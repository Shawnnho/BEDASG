<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hawker Point — Item</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/browsing.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="home.html" aria-label="Back to Home">
          <img
            src="images/logo.png"
            alt="Hawker Point logo"
            class="brand-logo"
          />
        </a>

        <nav class="nav" aria-label="Main navigation">
          <a class="pill" href="home.html">Home</a>
          <a class="pill" href="promotions.html">Promotions</a>
          <a class="pill" href="orders.html">Orders</a>
          <a class="pill" href="feedback.html">Feedback</a>
          <a class="pill" href="hygiene.html">Hygiene</a>

          <a class="pill cartPill" href="cart.html">
            Cart <span id="cartCount" class="cartBadge isZero">0</span>
          </a>

          <a class="pill account" href="account.html">Account</a>
        </nav>

        <button
          id="menuBtn"
          class="menuBtn"
          type="button"
          aria-label="Open menu"
        >
          ☰
        </button>
      </div>

      <div id="navBackdrop" class="navBackdrop"></div>

      <nav id="navMobile" class="navMobile" aria-label="Mobile navigation">
        <a class="mLink" href="home.html">Home</a>
        <a class="mLink" href="promotions.html">Promotions</a>
        <a class="mLink" href="orders.html">Orders</a>
        <a class="mLink" href="feedback.html">Feedback</a>
        <a class="mLink" href="hygiene.html">Hygiene</a>

        <a class="mLink" href="cart.html">
          Cart <span id="cartCountMobile" class="cartBadge isZero">0</span>
        </a>

        <a class="mLink" href="account.html">Account</a>
      </nav>
    </header>

    <main class="page itemPage">
      <div class="itemShell">
        <div class="itemHero">
          <img id="itemImg" alt="Food image" />
        </div>

        <div class="itemTopRow">
          <h1 id="itemName" class="itemName">Item</h1>

          <div class="itemPriceBox">
            <div id="itemBasePrice" class="itemPrice">$0.00</div>
            <div class="itemPriceSub">Base Price</div>
          </div>
        </div>

        <p id="itemDesc" class="itemDesc"></p>

        <hr class="itemDivider" />

        <div id="variantsSection">
          <h3 class="sectionTitle">Choose an option</h3>
          <div id="variantsList"></div>
        </div>


        <div id="addonsSection">
          <div class="itemSectionTitle">Add On's</div>
          <div id="addonsList" class="addonsList"></div>
        </div>

        <hr class="itemDivider" />

        <div class="itemSectionTitle">Side Note</div>
        <textarea
          id="sideNote"
          class="sideNote"
          placeholder="Any notes?"
          rows="3"
        ></textarea>

        <div class="qtyRow">
          <button
            id="qtyMinus"
            class="qtyBtn"
            type="button"
            aria-label="Decrease"
          >
            −
          </button>

          <div id="qtyVal" class="qtyVal">1</div>

          <button
            id="qtyPlus"
            class="qtyBtn primary"
            type="button"
            aria-label="Increase"
          >
            +
          </button>
        </div>

        <button id="addToCartBtn" class="addCartBtn" type="button">
          Add to Cart ($0.00)
        </button>
      </div>
    </main>

    <script src="js/authClient.js"></script>
    <script type="module" src="js/item.js"></script>
    <script type="module" src="js/cart.js"></script>
    <script src="js/guest-nav.js"></script>
  </body>
</html>
